                    <span class="toggle-password" id="toggleNewPassword">
                        <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                            <path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M6.5 6.7C4 8.3 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.4 4.7-1M9.5 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-2.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="password-rules" id="passwordRules">
                    <div id="ruleLength" class="rule-item">
                        <svg class="rule-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                        <span>حداقل ۸ کاراکتر</span>
                    </div>
                    <div id="ruleUpper" class="rule-item">
                        <svg class="rule-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                        <span>حداقل یک حرف بزرگ (A-Z)</span>
                    </div>
                    <div id="ruleLower" class="rule-item">
                        <svg class="rule-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                        <span>حداقل یک حرف کوچک (a-z)</span>
                    </div>
                    <div id="ruleNumber" class="rule-item">
                        <svg class="rule-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                        <span>حداقل یک عدد (0-9)</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="password-field">
                    <input id="confirmPassword" type="password" placeholder="تکرار رمز عبور جدید">
                    <span class="toggle-password" id="toggleConfirmPassword">
                        <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                            <path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M6.5 6.7C4 8.3 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.4 4.7-1M9.5 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-2.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <p class="field-hint" id="confirmPasswordHint">رمز عبور جدید را دوباره وارد کنید</p>
            </div>

            <div class="modal-buttons">
                <button id="savePassword">ذخیره</button>
                <button id="closePassword">انصراف</button>
            </div>
        </div>
    </div>
