<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پنل کاربری</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="user-responsive.css">
    <link rel="shortcut icon" href="./img/favico.ico.png" type="image/x-icon">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <div class="user-box">

                <button type="button" class="menu-toggle" id="menuToggle" aria-label="باز کردن منو" aria-expanded="false" aria-controls="dashboardMenu">
                    <svg class="icon-menu" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>

                <div class="user-box-info">
                    <span class="user-box-svg">
                        <svg class="user-box-svg__svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M11.889 12.6188H11.921C14.849 12.6188 17.23 10.2378 17.23 7.30976C17.23 4.38176 14.849 1.99976 11.921 1.99976C8.99202 1.99976 6.61002 4.38176 6.61002 7.30676C6.60002 10.2268 8.96702 12.6098 11.889 12.6188ZM8.03802 7.30976C8.03802 5.16876 9.78002 3.42776 11.921 3.42776C14.061 3.42776 15.802 5.16876 15.802 7.30976C15.802 9.44976 14.061 11.1918 11.921 11.1918H11.892C9.76002 11.1838 8.03102 9.44376 8.03802 7.30976Z"
                                fill="black" />
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M4 18.1731C4 21.8701 9.962 21.8701 11.921 21.8701C15.32 21.8701 19.84 21.4891 19.84 18.1931C19.84 14.4961 13.88 14.4961 11.921 14.4961C8.521 14.4961 4 14.8771 4 18.1731ZM5.5 18.1731C5.5 16.7281 7.66 15.9961 11.921 15.9961C16.181 15.9961 18.34 16.7351 18.34 18.1931C18.34 19.6381 16.181 20.3701 11.921 20.3701C7.66 20.3701 5.5 19.6311 5.5 18.1731Z"
                                fill="black" />
                        </svg>
                    </span>
                    <span id="userName"></span>
                </div>

            </div>

            <div class="valet-wraper">
                <div class="my-valet">
                    <span>کیف پول من</span>
                    <p>موجودی 1,200,000 تومان</p>
                </div>
            </div>

            <div class="dashboard-line"></div>
            <ul class="dashboard-ul" id="dashboardMenu">

                <li data-view="dashboard" class="active dashboard-ul__item">
                    <span>داشبورد</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <title xmlns="">home-03</title>
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="1.5">
                            <path
                                d="M3 11.99v2.51c0 3.3 0 4.95 1.025 5.975S6.7 21.5 10 21.5h4c3.3 0 4.95 0 5.975-1.025S21 17.8 21 14.5v-2.51c0-1.682 0-2.522-.356-3.25s-1.02-1.244-2.346-2.276l-2-1.555C14.233 3.303 13.2 2.5 12 2.5s-2.233.803-4.298 2.409l-2 1.555C4.375 7.496 3.712 8.012 3.356 8.74S3 10.308 3 11.99" />
                            <path
                                d="M15 21.5v-5c0-1.414 0-2.121-.44-2.56c-.439-.44-1.146-.44-2.56-.44s-2.121 0-2.56.44C9 14.378 9 15.085 9 16.5v5" />
                        </g>
                    </svg>
                </li>

                <li data-view="orders" class="dashboard-ul__item">
                    <span>سفارش ها</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <title xmlns="">shopping-basket-01</title>
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="1.5">
                            <path
                                d="M8 7h8c1.886 0 2.828 0 3.414.586S20 9.114 20 11v4c0 3.3 0 4.95-1.025 5.975S16.3 22 13 22h-2c-3.3 0-4.95 0-5.975-1.025S4 18.3 4 15v-4c0-1.886 0-2.828.586-3.414S6.114 7 8 7" />
                            <path d="M16 9.5C16 5.634 14.21 2 12 2S8 5.634 8 9.5" />
                        </g>
                    </svg>
                </li>

                <li data-view="favorites" class="dashboard-ul__item">
                    <span>علاقه‌مندی</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <title xmlns="">favourite</title>
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="1.5"
                            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" />
                    </svg>
                </li>

                <li data-view="profile" class="dashboard-ul__item">
                    <span>اطلاعات حساب</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <title xmlns="">user</title>
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="1.5">
                            <path d="M17 8.5a5 5 0 1 0-10 0a5 5 0 0 0 10 0" />
                            <path d="M19 20.5a7 7 0 1 0-14 0" />
                        </g>
                    </svg>
                </li>

                <li id="logout" class="dashboard-ul__item">
                    <span>خروج</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <title xmlns="">logout-square-01</title>
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="1.5"
                            d="M14.5 6c-.047-1.093-.185-1.79-.598-2.326a3 3 0 0 0-.554-.554c-.81-.62-1.985-.62-4.335-.62h-.501c-2.834 0-4.251 0-5.132.879c-.88.878-.88 2.293-.88 5.121v7c0 2.828 0 4.243.88 5.121s2.298.879 5.132.879h.5c2.351 0 3.526 0 4.336-.62q.314-.241.554-.554c.413-.536.551-1.233.598-2.326m6-6h-12m9.5 3.5s3.5-2.578 3.5-3.5S18 8.5 18 8.5" />
                    </svg>
                </li>

            </ul>

        </aside>

        <main class="content">

            <div class="btn-home">
                <a class="back-home-btn" href="/frontend/index.html">
                    بازگشت به خانه
                </a>
            </div>

            <!-- محتوای هر بخش ساید‌بار اینجا با جی‌اس تزریق میشه (کامپوننت‌ها تو پوشه components) -->
            <div id="viewContainer"></div>

        </main>

    </div>

    <!-- مودال‌های پروفایل: همیشه تو صفحه هستن، فقط وقتی ویو پروفایل بازه استفاده میشن -->
    <div class="modal-overlay" id="editModal">
        <div class="edit-modal">
            <h2 id="modalTitle"></h2>

            <div class="input-status-field" id="editInputWrap">
                <input id="editInput" type="text">
                <span class="input-status-icon" id="editInputIcon">
                    <svg class="icon-plus" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <svg class="icon-check" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                        <path d="M5 13l4 4L19 7" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </div>

            <textarea id="editTextarea" style="display:none"></textarea>

            <div class="modal-buttons">
                <button id="saveProfile">ذخیره</button>
                <button id="closeModal">انصراف</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="passwordModal">
        <div class="edit-modal">
            <h2>تغییر رمز عبور</h2>

            <div class="form-group">
                <div class="password-field">
                    <input id="currentPassword" type="password" placeholder="رمز عبور فعلی خود را وارد کنید">
                    <span class="toggle-password" id="toggleCurrentPassword">
                        <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                            <path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M6.5 6.7C4 8.3 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.4 4.7-1M9.5 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-2.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <p class="field-hint">رمز عبور فعلی حساب کاربری خود را وارد کنید</p>
            </div>

            <div class="form-group">
                <div class="password-field">
                    <input id="newPassword" type="password" placeholder="رمز عبور جدید را وارد کنید">
                    <span class="toggle-password" id="toggleNewPassword">
                        <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                            <path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M6.5 6.7C4 8.3 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.4 4.7-1M9.5 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-2.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="password-rules" id="passwordRules">
                    <div id="ruleLength" class="rule-item">
                        <svg class="rule-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                        <span>حداقل ۸ کاراکتر</span>
                    </div>
                    <div id="ruleUpper" class="rule-item">
                        <svg class="rule-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                        <span>حداقل یک حرف بزرگ (A-Z)</span>
                    </div>
                    <div id="ruleLower" class="rule-item">
                        <svg class="rule-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                        <span>حداقل یک حرف کوچک (a-z)</span>
                    </div>
                    <div id="ruleNumber" class="rule-item">
                        <svg class="rule-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                        <span>حداقل یک عدد (0-9)</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="password-field">
                    <input id="confirmPassword" type="password" placeholder="تکرار رمز عبور جدید">
                    <span class="toggle-password" id="toggleConfirmPassword">
                        <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                            <path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M6.5 6.7C4 8.3 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.4 4.7-1M9.5 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-2.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <p class="field-hint" id="confirmPasswordHint">رمز عبور جدید را دوباره وارد کنید</p>
            </div>

            <div class="modal-buttons">
                <button id="savePassword">ذخیره</button>
                <button id="closePassword">انصراف</button>
            </div>
        </div>
    </div>

    <!-- هسته اصلی: روتر، ساید‌بار، توابع مشترک -->
    <script src="app.js"></script>

    <!-- کامپوننت هر بخش، هر کدوم تو فایل خودش - هر وقت خواستی بخش جدید اضافه کنی
         فقط یه فایل جدید تو components بساز و همینجا اضافه‌ش کن -->
    <script src="components/dashboard.js"></script>
    <script src="components/orders.js"></script>
    <script src="components/favorites.js"></script>
    <script src="components/profile.js"></script>
    <script src="components/order-details.js"></script>
    <script src="components/invoice.js"></script>

</body>

</html>
