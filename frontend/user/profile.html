<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پروفایل کاربری</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="profile.css">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="logo">
                NSG
            </div>

            <ul>

                <li onclick="location.href='dashboard.html'">
                    داشبورد
                </li>

                <li onclick="location.href='orders.html'">
                    سفارش‌های من
                </li>

                <li class="active">
                    پروفایل
                </li>

                <li id="logout">
                    خروج
                </li>

            </ul>

        </aside>

        <main class="content">

            <div class="profile-card">

                <div class="profile-header">

                    <img src="../img/user.png" class="avatar">

                    <h2 id="userName"></h2>

                </div>

                <div class="profile-info">

                    <div class="info-item">

                        <span>نام</span>

                        <strong id="name"></strong>

                    </div>

                    <div class="info-item">

                        <span>ایمیل</span>

                        <strong id="email"></strong>

                    </div>

                    <div class="info-item">

                        <span>شماره موبایل</span>

                        <strong id="phone"></strong>

                    </div>

                    <div class="info-item">

                        <span>آدرس</span>

                        <strong id="address"></strong>

                    </div>

                </div>

                <button id="editProfile">

                    ویرایش اطلاعات

                </button>
                <hr class="profile-divider">

                <div class="security-section">

                    <h3>

                        امنیت حساب

                    </h3>

                    <p>

                        برای افزایش امنیت حساب، رمز عبور خود را به‌صورت دوره‌ای تغییر دهید.

                    </p>

                    <button id="changePassword">

                        تغییر رمز عبور

                    </button>

                </div>

            </div>

        </main>

    </div>



    <div class="modal-overlay" id="editModal">

        <div class="edit-modal">

            <h2>ویرایش اطلاعات</h2>

            <input id="editName" type="text" placeholder="نام">

            <input id="editPhone" type="text" placeholder="شماره موبایل">

            <textarea id="editAddress" placeholder="آدرس"></textarea>

            <div class="modal-buttons">

                <button id="saveProfile">

                    ذخیره

                </button>

                <button id="closeModal">

                    انصراف

                </button>

            </div>

        </div>

    </div>

    <div class="modal-overlay" id="passwordModal">

        <div class="edit-modal">

            <h2>

                تغییر رمز عبور

            </h2>

            <div class="password-field">

                <input id="currentPassword" type="password" placeholder="رمز عبور فعلی">

                <i class="fa-solid fa-eye toggle-password" id="toggleCurrentPassword"></i>

            </div>

            <input id="newPassword" type="password" placeholder="رمز عبور جدید">
            <div class="password-rules" id="passwordRules">

                <div id="ruleLength">❌ حداقل ۸ کاراکتر</div>

                <div id="ruleUpper">❌ حداقل یک حرف بزرگ (A-Z)</div>

                <div id="ruleLower">❌ حداقل یک حرف کوچک (a-z)</div>

                <div id="ruleNumber">❌ حداقل یک عدد (0-9)</div>

            </div>

            <input id="confirmPassword" type="password" placeholder="تکرار رمز عبور جدید">

            <div class="modal-buttons">

                <button id="savePassword">

                    ذخیره

                </button>

                <button id="closePassword">

                    انصراف

                </button>

            </div>

        </div>

    </div>
    <script src="profile.js"></script>

</body>

</html>
